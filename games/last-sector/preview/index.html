<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Pack Preview</title><style>body{margin:0;background:#10131a;color:#eaf0ff;font:15px system-ui,sans-serif}.bar{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;padding:14px 20px;background:#171c27;border-bottom:1px solid #2e3950}.bar button{margin-left:auto;background:#25314a;color:#fff;border:1px solid #52698e;border-radius:9px;padding:9px 13px;cursor:pointer}.wrap{max-width:1400px;margin:auto;padding:20px}.meta{color:#91a6ca;font-size:12px}.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:18px}.card{background:#171c27;border:1px solid #2d3850;border-radius:18px;overflow:hidden}.label{padding:10px 14px;border-bottom:1px solid #2d3850;color:#9cb5df;font-size:11px;letter-spacing:.14em}.tv{min-height:460px;padding:28px;background:radial-gradient(circle at 50% 45%,#263754,#121722 65%);position:relative}.board{height:330px;border:1px solid #536a90;border-radius:16px;display:grid;place-items:center;box-shadow:inset 0 0 70px #0008}.board h2{font-size:clamp(32px,6vw,72px);letter-spacing:.12em;text-align:center}.hud{display:flex;justify-content:space-between;gap:12px;margin-top:18px}.pill{border:1px solid #445778;border-radius:999px;padding:8px 12px}.player{padding:20px;display:grid;gap:16px}.phase{padding:18px;border:1px solid #3b4b68;border-radius:14px;font-size:22px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:14px;border-radius:12px;background:#202838;border:1px solid #33415b}.stat small{display:block;color:#8da2c4}.stat b{font-size:28px}.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;padding:16px}.asset{height:120px;background:#111722;border:1px solid #33415b;border-radius:10px;overflow:hidden;display:grid;place-items:center;position:relative}.asset img{max-width:100%;max-height:100%;object-fit:contain}.asset span{position:absolute;bottom:4px;font-size:9px;background:#000a;padding:3px}.empty{padding:20px;color:#91a6ca}.note{padding:12px 16px;color:#91a6ca;font-size:12px;border-top:1px solid #2d3850}@media(max-width:850px){.grid{grid-template-columns:1fr}.tv{min-height:360px}}.visual-scene{position:relative;min-height:100%;display:grid;place-items:center;overflow:hidden}.scene-grid{width:min(88%,760px);display:grid;grid-template-columns:repeat(4,1fr);gap:10px;z-index:1}.scene-node{min-height:72px;border:1px solid #52698e;border-radius:14px;background:#162033cc;padding:10px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 12px 30px #0004}.scene-node span{font-size:11px;color:#a8bddf}.scene-node b{font-size:22px}.scene-node.n1{transform:translateY(-8px)}.scene-node.n2{transform:translateY(8px)}.scene-orbit{position:absolute;width:55%;aspect-ratio:1;border:1px solid #6d8cb455;border-radius:50%;box-shadow:0 0 90px #31598b33}.visual-scene.player .scene-grid{grid-template-columns:repeat(2,1fr)}.visual-scene.player{min-height:280px}@media(max-width:650px){.scene-grid{grid-template-columns:repeat(3,1fr)}}</style><body><header class="bar"><div><b id="title"></b><div id="gid" class="meta"></div></div><button id="randomize">Случайная сцена</button></header><main class="wrap"><div class="grid"><section class="card"><div class="label">TV BOARD PREVIEW</div><div class="tv"><div id="real-tv" class="board"><div><h2 id="scene"></h2><p style="text-align:center;color:#9fb5d9">Готовый автономный снимок игрового состояния</p></div></div><div class="hud"><span id="turn" class="pill"></span><span id="caps" class="pill"></span></div></div></section><section class="card"><div class="label">PLAYER UI PREVIEW</div><div id="real-player" class="player"><div id="phase" class="phase"></div><div id="stats" class="stats"></div><div class="note">Preview — только визуализация. Сервер, WebSocket и игровые команды отключены.</div></div></section></div><section class="card" style="margin-top:18px"><div class="label">REAL PACK ASSETS</div><div id="assets" class="assets"></div></section></main><script type="module" src="./preview.js"></script></body></html>
